name: 'Quant Agent Deploy'
description: 'Create, update, and manage AI agents on the Quant platform'
branding:
  icon: 'upload-cloud'
  color: 'blue'
inputs:
  quant_api_key:
    description: 'Quant API key'
    required: true
  quant_organization:
    description: 'Quant organisation name'
    required: true
  agents_dir:
    description: 'Directory containing agent definitions (agent.json, prompt)'
    required: true
    default: 'agents/'
  base_url:
    description: 'Quant API base URL'
    required: false
outputs:
  deployed_agents:
    description: 'JSON map of directory name to agent ID'
runs:
  using: 'node20'
  main: 'dist/index.js'
